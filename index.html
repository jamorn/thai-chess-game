<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thai Chess Win95</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Tahoma", "Segoe UI", sans-serif;
        background-color: #008080;
        margin: 0;
        padding: 10px;
        min-height: 100vh;
      }
      .win95-window {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #ffffff #808080 #808080 #ffffff;
        padding: 3px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        width: auto;
        max-width: 700px;
        margin: 0 auto;
      }
      .title-bar {
        background: linear-gradient(90deg, #000080, #1084d0);
        color: white;
        padding: 3px 6px;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .main-content {
        display: flex;
        gap: 10px;
        padding: 10px;
      }
      .board-container {
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        background: #ffffff;
        flex-shrink: 0;
        display: inline-block;
        overflow: visible;
      }
      table.chess-board-win95 {
        border-collapse: collapse;
      }
      table.chess-board-win95 td {
        /* cell พอดี viewport ทั้งกว้าง/สูง => board ไม่ถูกตัดแม้หมุนจอแนวนอน */
        width: clamp(20px, calc(min(100dvw - 20px, 100dvh - 70px) / 8), 80px);
        height: clamp(20px, calc(min(100dvw - 20px, 100dvh - 70px) / 8), 80px);
        text-align: center;
        vertical-align: middle;
        font-weight: bold;
        cursor: pointer;
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .piece-red img,
      .piece-black img {
        display: block;
        pointer-events: none;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }
      .cell-light {
        background-color: #a8c98f;
      }
      .cell-dark {
        background-color: #7fa86a;
      }
      td.selected {
        outline: 2px solid #0000ff;
        outline-offset: -2px;
      }
      .piece-red,
      .piece-black {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .sidebar {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .history-box {
        height: 250px;
        background: white;
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        overflow-y: auto;
        padding: 5px;
        font-size: 12px;
      }
      .history-box ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .status-bar {
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        padding: 4px;
        font-size: 12px;
        background: #c0c0c0;
        min-height: 18px;
      }
      .flash-text {
        color: #800000;
        font-weight: bold;
      }

      /* ---------- Responsive (จอเล็ก) ---------- */
      /* ขนาด cell จัดการด้วย clamp() อัตโนมัติ => ไม่จำเป็นต้อง media query fix ขนาด */
      /* เมื่อจอแคบ (vertical) ให้ history ย้ายไปอยู่ใต้กระดาน ไม่ผลักข้าง */
      @media (max-width: 560px) {
        .main-content {
          flex-direction: column;
          align-items: center;
        }
        .sidebar {
          width: 100%;
        }
        .history-box {
          height: 140px;
        }
      }
      /* เมื่อจอแนวนอน (landscape) จอเตี้ย ให้ history ย้ายไปด้านล่างและสั้นลง
         เพื่อให้กระดานใช้พื้นที่แนวขวาง/แนวตั้งได้เต็ม ไม่ถูก sidebar ริมกินพื้นที่ */
      @media (orientation: landscape) and (max-height: 620px) {
        body {
          padding: 4px;
        }
        .win95-window {
          max-width: 100%;
        }
        .main-content {
          flex-direction: column;
          align-items: center;
          padding: 4px;
          gap: 4px;
        }
        .board-container {
          flex-shrink: 0;
        }
        .sidebar {
          width: 100%;
          flex-direction: row;
        }
        .history-box {
          height: 60px;
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="win95-window">
      <div class="title-bar">
        <span>Thai Chess v1.0 (Win95 Edition)</span>
        <span>X</span>
      </div>
      <div class="main-content">
        <div id="board-container" class="board-container"></div>
        <div class="sidebar">
          <div class="history-box">
            <ul id="history-list"></ul>
          </div>
        </div>
      </div>
      <div id="status-bar" class="status-bar">พร้อมใช้งาน</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
