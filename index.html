<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thai Chess Win95</title>
    <style>
      body {
        font-family: "Tahoma", "Segoe UI", sans-serif;
        background-color: #008080;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .win95-window {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #ffffff #808080 #808080 #ffffff;
        padding: 3px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        width: 640px;
      }
      .title-bar {
        background: linear-gradient(90deg, #000080, #1084d0);
        color: white;
        padding: 3px 6px;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
      }
      .main-content {
        display: flex;
        gap: 10px;
        padding: 10px;
      }
      .board-container {
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        background: #ffffff;
      }
      table.chess-board-win95 {
        border-collapse: collapse;
      }
      table.chess-board-win95 td {
        width: 48px;
        height: 48px;
        text-align: center;
        vertical-align: middle;
        font-weight: bold;
        cursor: pointer;
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .cell-light {
        background-color: #ffce9e;
      }
      .cell-dark {
        background-color: #d18b47;
      }
      td.selected {
        outline: 2px solid #0000ff;
        outline-offset: -2px;
      }
      .piece-red {
        color: #cc0000;
      }
      .piece-black {
        color: #000000;
      }
      .sidebar {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .history-box {
        height: 250px;
        background: white;
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        overflow-y: auto;
        padding: 5px;
        font-size: 12px;
      }
      .history-box ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .status-bar {
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        padding: 4px;
        font-size: 12px;
        background: #c0c0c0;
        min-height: 18px;
      }
      .flash-text {
        color: #800000;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="win95-window">
      <div class="title-bar">
        <span>Thai Chess v1.0 (Win95 Edition)</span>
        <span>X</span>
      </div>
      <div class="main-content">
        <div id="board-container" class="board-container"></div>
        <div class="sidebar">
          <div class="history-box">
            <ul id="history-list"></ul>
          </div>
        </div>
      </div>
      <div id="status-bar" class="status-bar">พร้อมใช้งาน</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
