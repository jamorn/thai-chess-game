<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thai Chess Win95</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Tahoma", "Segoe UI", sans-serif;
        background-color: #008080;
        margin: 0;
        padding: 10px;
        min-height: 100vh;
      }
      .win95-window {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #ffffff #808080 #808080 #ffffff;
        padding: 3px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        width: auto;
        max-width: 700px;
        margin: 0 auto;
      }
      .title-bar {
        background: linear-gradient(90deg, #000080, #1084d0);
        color: white;
        padding: 3px 6px;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 10px;
      }
      .board-container {
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        background: #ffffff;
        flex-shrink: 0;
        display: inline-block;
        overflow: visible;
      }
      table.chess-board-win95 {
        border-collapse: collapse;
      }
      table.chess-board-win95 td {
        /* cell พอดี viewport ทั้งกว้าง/สูง => board ไม่ถูกตัดแม้หมุนจอแนวนอน */
        width: clamp(20px, calc(min(100dvw - 20px, 100dvh - 70px) / 8), 80px);
        height: clamp(20px, calc(min(100dvw - 20px, 100dvh - 70px) / 8), 80px);
        text-align: center;
        vertical-align: middle;
        font-weight: bold;
        cursor: pointer;
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .piece-red img,
      .piece-black img {
        display: block;
        pointer-events: none;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }
      .cell-light {
        background-color: #a8c98f;
      }
      .cell-dark {
        background-color: #7fa86a;
      }
      td.selected {
        outline: 2px solid #0000ff;
        outline-offset: -2px;
      }
      .piece-red,
      .piece-black {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .sidebar {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .history-box {
        height: 250px;
        background: white;
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        overflow-y: auto;
        padding: 5px;
        font-size: 12px;
      }
      .history-box ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .status-bar {
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        padding: 4px;
        font-size: 12px;
        background: #c0c0c0;
        min-height: 18px;
      }
      .flash-text {
        color: #800000;
        font-weight: bold;
      }

      /* ✅ ใหม่: ประวัติการเดิน — เป็นหน่วยแยกจากกระดาน (โค๊แล็ปซ/ขยายเองได้)
         ค่าเริ่มต้น .hidden ทำให้กดปุ่มถึงจะโผล่ เพื่อไม่แย่งพื้นที่board */
      .history-section {
        padding: 3px 10px 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .win95-btn {
        font-family: "Tahoma", "Segoe UI", sans-serif;
        font-size: 12px;
        padding: 3px 8px;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #ffffff #808080 #808080 #ffffff;
        cursor: pointer;
        align-self: flex-start;
      }
      .win95-btn:active {
        border-color: #808080 #ffffff #ffffff #808080;
      }
      .history-box.hidden {
        display: none;
      }

      /* ---- ป้ายบอกช่องแบบหมากรุกไทย (rank 1-8 / file ก...) ---- */
      .chess-frame {
        position: relative;
        display: inline-block;
      }
      .coord-coord {
        position: absolute;
        font-family: "Tahoma", "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: bold;
        transform: translateY(-50%);
        pointer-events: none;
        line-height: 1;
        white-space: nowrap;
      }
      .coord-file {
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 2px;
        padding: 0 2px;
      }
      /* จอเล็ก จัดให้ป้ายเล็กลงตาม เพื่อไม่ทับกันเวลา board เล็กลง */
      @media (max-width: 560px) {
        .coord-coord {
          font-size: 8px;
        }
        .coord-rank {
          left: -10px;
        }
      }
      @media (orientation: landscape) and (max-height: 620px) {
        .coord-coord {
          font-size: 8px;
        }
      }

      /* ---------- Responsive (จอเล็ก) ---------- */
      /* 模式ล็อกให้เล่นแนวตั้งเท่านั้น: หมุนจอแนวนอนจะแสดง modal บอก ไม่ใช่ปรับ CSS */
      .rotate-modal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(2px);
        font-family: "Tahoma", "Segoe UI", sans-serif;
        color: #fff;
      }
      .rotate-modal.open {
        display: flex;
      }
      /* หากล็อก orientation: หยุด scroll หลัง modal */
      body.rotation-locked {
        overflow: hidden;
      }
      .rotate-modal__box {
        background: #c0c0c0;
        color: #111;
        max-width: min(420px, 90vw);
        margin: 12px;
        padding: 18px 20px;
        text-align: center;
        border: 2px solid;
        border-color: #ffffff #808080 #808080 #ffffff;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
      }
      .rotate-modal__icon {
        font-size: 42px;
        line-height: 1;
        margin-bottom: 8px;
      }
      .rotate-modal__box h2 {
        margin: 6px 0 8px;
        font-size: 17px;
      }
      .rotate-modal__box p {
        margin: 0;
        font-size: 13px;
        color: #333;
      }

      /* ---------- Responsive (จอเล็ก) ---------- */
      /* ขนาด cell จัดการด้วย clamp() อัตโนมัติ => ไม่จำเป็นต้อง media query fix ขนาด */
      /* เมื่อจอแคบ (vertical) ให้ history ย้ายไปอยู่ใต้กระดาน ไม่ผลักข้าง */
      @media (max-width: 560px) {
        .main-content {
          flex-direction: column;
          align-items: center;
        }
        .sidebar {
          width: 100%;
        }
        .history-box {
          height: 140px;
        }
      }
      /* เมื่อจอแนวนอน (landscape) จอเตี้ย ให้ history ย้ายไปด้านล่างและสั้นลง
         เพื่อให้กระดานใช้พื้นที่แนวขวาง/แนวตั้งได้เต็ม ไม่ถูก sidebar ริมกินพื้นที่ */
      @media (orientation: landscape) and (max-height: 620px) {
        body {
          padding: 2px;
        }
        .win95-window {
          max-width: 100%;
        }
        .title-bar {
          font-size: 11px;
          padding: 2px 5px;
        }
        .main-content {
          flex-direction: column;
          align-items: center;
          padding: 2px;
          gap: 3px;
        }
        .board-container {
          flex-shrink: 0;
        }
        /* จอเตี้ยแนวนอน: ให้ cell หดตาม height (ไม่ผูก clamp 80px เต็ม) -->
           ทั้ง board ปุ่ม file + status ฟิตอยู่ในความสูง view พอดี ไม่ overflow */
        table.chess-board-win95 td {
          width: clamp(14px, calc(min(100vw - 24px, 100vh - 150px) / 8), 78px);
          height: clamp(14px, calc((100vh - 150px) / 8), 78px);
        }
        .history-section {
          padding: 1px 8px 0;
          gap: 2px;
        }
        .coord-coord {
          font-size: 8px;
        }
        .status-bar {
          padding: 2px;
          font-size: 11px;
        }
        /* กันไม่ให้ content ยืดเต็มวิว: ให้ window/ส่วนหลักพอดีกับ board แล้วกลาง */
        .win95-window {
          width: fit-content;
        }
        .main-content {
          width: fit-content;
        }
      }
    </style>
  </head>
  <body>
    <div class="win95-window">
      <div class="title-bar">
        <span>Thai Chess v1.0 (Win95 Edition)</span>
        <span>X</span>
      </div>
      <div class="main-content">
        <div id="board-container" class="board-container"></div>
      </div>

      <!-- ✅ ย้าย "ประวัติการเดิน" ออกจากบริเวณข้างกระดาน ไปเป็นหน่วยแยกต่างหาก
           โดยค่าเริ่มต้นซ่อน/ย่อไว้ (collapsed) — ผู้เล่นกดปุ่มด้านล่างเพื่อเปิดดูเองได้
           เพื่อไม่ให้กล่องประวัติแย่งพื้นที่หรือติดกับกระดาน -->
      <div class="history-section">
        <button
          id="toggle-history-btn"
          class="win95-btn"
          type="button"
          onclick="var b=document.getElementById('history-box'); var h=b.classList.toggle('hidden'); this.textContent = h ? '▶ ประวัติการเดิน (เปิดดู)' : '▼ ประวัติการเดิน (ซ่อน)';"
        >
          ▶ ประวัติการเดิน (เปิดดู)
        </button>
        <div id="history-box" class="history-box hidden">
          <ul id="history-list"></ul>
        </div>
      </div>

      <div id="status-bar" class="status-bar">พร้อมใช้งาน</div>
    </div>

    <!-- Modal: บังคับเล่นแนวตั้ง ถ้าผู้ใช้หมุนเป็นแนวนอน -->
    <div id="rotate-modal" class="rotate-modal" aria-live="polite">
      <div class="rotate-modal__box" role="alertdialog" aria-label="ต้องใช้แนวตั้ง">
        <div class="rotate-modal__icon">🔄️</div>
        <h2>กรุณาหมุนเป็นแนวตั้ง</h2>
        <p>เกมนี้รองรับการเล่นแบบแนวตั้ง</p>
        <p>หมุนจอกลับมาแนวตั้งก็เล่นต่อได้ทันที</p>
      </div>
    </div>

    <!-- Self-host UI (แยกจาก main/business) -- ตาม "ห้าม pollute main.ts" -->
    <script type="module" src="/src/ui/AiChallengeModal.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
